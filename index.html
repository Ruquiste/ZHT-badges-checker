<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ZHT Badge Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="header-brand">
    <img src="logo.png" alt="Logo" class="logo">
    <div class="brand-text">
      <div class="brand-title">Badge Checker</div>
      <p class="subtitle">Click a bar to see full details, click again to close it.</p>
    </div>
  </div>

  <div class="controls">
    <input type="text" id="username" placeholder="Enter Roblox Username">
    <button onclick="checkBadges()">Check Badges</button>
  </div>
  <div class="status-line" id="status-line"></div>
  <div class="progress-summary" id="progress-summary"></div>

  <div id="channels-container"></div>

  <script src="badges-data.js"></script>
  <script src="script.js"></script>
</body>
</html>
